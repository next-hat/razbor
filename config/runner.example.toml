# Optional full runner configuration for local Docker Compose provisioning.
# UI enrollment remains available without TOML. Values below match runtime defaults.
# No database, forge or indexer-management credentials belong on runners.
[registration]
key = "compose-local" # keep this key and the registration/job volumes on restart
name = "Local Compose runner"
# Initial assignments: existing repository public IDs or application config keys.
# Empty works before repositories exist; assign them later in Runners > Manage.
repositories = []

[control]
url = "http://web:3000"
allow_http = true # trusted local Compose network only; use HTTPS remotely
# Generated by runner-registration and mounted read-only into the runner.
enrollment_token = { file = "/runner-registration/state/token" }

[runner]
concurrency = 1
timeout_ms = 3600000
shutdown_grace_ms = 15000

[docker]
socket = "/var/run/docker.sock"
runtime = "runc" # agent runtime inside DinD; Compose runs the runner VM with Kata
image = "node:24-bookworm"
network = "razbor-jobs"
cpus = 2
memory_mb = 1024
pids = 128
uid = 1000
gid = 1000

[storage]
root = "/job-data"
host_root = "/job-data"
runtime_root = "/workspace"
dependencies_volume = "razbor-runtime"

[harness]
initialDiffMaxBytes = 4096 # UTF-8 bytes; 0 forces lazy context for nonempty changes
compactionThresholdTokens = 80000 # trigger for reducible history, not a hard context limit
# contextWindowTokens = 128000 # optional example; use the selected model's supported window

[harness.reviewBudget]
maxToolCalls = 2048
maxTokens = 1000000
maxOutputTokens = 4096
# maxCostUsd = 1.0 # requires a matching provider AND model price entry
# Uncapped reviews without a matching entry continue without a USD estimate.
# Supply verified prices for every selected provider/model pair using array entries.
# [[harness.reviewBudget.pricing]]
# provider = "openai"
# model = "exact-model-id"
# inputUsdPerMillion = 0 # set current operator-verified rates
# cachedInputUsdPerMillion = 0
# outputUsdPerMillion = 0
# cacheWriteUsdPerMillion = 0 # zero only when not separately billed
# Add more [[harness.reviewBudget.pricing]] entries for other provider/model pairs.
# The legacy single [harness.reviewBudget.pricing] table is also accepted;
# its omitted provider means "openai". Do not combine the single and array forms.

[model]
# Assign an AI reviewer to each repository in the UI. Its endpoint, model and
# API key are resolved for each review; no model environment variables are needed.
# Optional legacy fallback for reviews without an assigned AI reviewer:
# provider = "openai" # or "anthropic", whose endpoint must end in /messages
# endpoint = "https://model.example.com/v1/responses"
# api_key = { file = "/run/secrets/model_key" } # mount this file explicitly
# model = "gpt-oss-20b" # configure all three legacy fields together
reasoning_effort = "high" # fallback; saved AI reviewer profiles pin their own effort
supports_tools = true # false fails clearly when the diff requires lazy loading
max_requests = 512 # aggregate ceiling including compaction, final output and one JSON correction
max_retries = 0 # opt in to bounded retries of known nonbillable rate rejections
max_request_bytes = 2000000
max_response_bytes = 1000000
max_output_tokens = 4096
timeout_ms = 3600000 # one hour per model request, bounded by the remaining review deadline
relay_port = 8787

# Optional trusted inputs. Mount these specific operator directories into the runner.
# Repository Settings also select managed/repository skills and scoped AGENTS.md
# without these host inputs. See docs/skills.md.
# [capabilities]
# base_instructions = true
# instruction_file = "/approved/instructions.md"
# skill_directories = ["/approved/skills"]
