[registry]
key = "application"

[forges.forgejo]
type = "forgejo"
api_url = "https://forgejo.example.com/api/v1"
web_url = "https://forgejo.example.com"
credential = { file = "/forge-secrets/razbor.forgejo.token" }

[repositories.project]
forge = "forgejo"
selector = "team/project"
indexing = { owner = "local-indexer", persistent = false }

[repositories.project.git]
branch = "main"
upstream = "refs/remotes/origin/main"
remotes = { origin = "https://forgejo.example.com/team/project.git" }
# Use the bot account login and the same token as the forge API connection.
credentials = { kind = "https", username = "razbor", token_file = "/forge-secrets/razbor.forgejo.token" }

# Omit this section on the FIRST apply to manage webhook settings through the UI.
[repositories.project.webhook]
enabled = true
callback_base = "https://hooks.example.com"
secret = { file = "/forge-secrets/razbor.webhook.secret" }
permitted_senders = ["alice"] # ["*"] only permits commands while the repo is private
