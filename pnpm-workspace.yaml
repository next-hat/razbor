packages:
  - apps/*
  - packages/*

# The Kata agent mounts one dependency tree shared with its runner snapshot.
# Keep that existing flat layout while pnpm selects each image's runtime graph.
nodeLinker: hoisted

# Keep the existing dependency install hooks explicit for frozen pnpm installs.
allowBuilds:
  cpu-features@0.0.10: true
  esbuild@0.28.2: true
  fsevents@2.3.3: true
  protobufjs@7.6.6: true
  ssh2@1.17.0: true

minimumReleaseAgeExclude:
  - "@next/env@16.4.1"
  - "@next/eslint-plugin-next@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - "@shadcn/registry@0.1.4"
  - lucide-react@1.57.0
  - next@16.4.1
  - openai@7.33.0
  - react-dom@19.3.1
  - react@19.3.1
  - shadcn@4.21.5
  - undici@8.12.1
  - "@ai-sdk/anthropic@4.0.80"
  - "@ai-sdk/gateway@4.0.114"
  - "@ai-sdk/openai@4.0.94"
  - "@ai-sdk/provider-utils@5.0.60"
  - ai@7.0.141
